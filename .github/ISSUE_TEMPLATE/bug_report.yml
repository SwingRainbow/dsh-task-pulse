name: Bug report
description: Report a reproducible problem with Task Pulse
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem without guessing.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and which tab or action was involved?
      placeholder: The Progress tab shows ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session with docs/tasks/...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.2.2-rc.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "Windows 11, Node.js 24"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant Harness logs or attach a screenshot.
      render: text
