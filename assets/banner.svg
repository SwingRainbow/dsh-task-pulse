<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">Task Pulse</title>
  <desc id="tp-desc">Read-only task progress for DeepSeek Harness</desc>
  <defs>
    <linearGradient id="tp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="tp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#22d3a6"/>
    </linearGradient>
    <radialGradient id="tp-glow" cx="0.16" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#tp-bg)"/>
  <rect width="1200" height="300" fill="url(#tp-glow)"/>
  <rect width="1200" height="300" fill="url(#tp-grid)"/>

  <g transform="translate(84 86)">
    <rect width="96" height="96" rx="22" fill="#101a33" stroke="#3f6cff" stroke-width="2"/>
    <path d="M24 32h48M24 48h32M24 64h22" stroke="#8fb0ff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="66" r="5" fill="#22d3a6"/>
  </g>

  <text x="212" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f5f7ff">Task Pulse</text>
  <text x="214" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#9fb0ca">Read-only task progress for DeepSeek Harness</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7d4ea">
    <rect x="214" y="202" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="236" y="223">docs/tasks</text>
    <rect x="344" y="202" width="106" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="366" y="223">read-only</text>
    <rect x="462" y="202" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="484" y="223">zero writes</text>
  </g>

  <path d="M748 218h44l16-38 22 76 20-58 16 20h34l14-30 20 48 16-18h58" fill="none" stroke="url(#tp-accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <circle cx="1108" cy="218" r="5" fill="#22d3a6"/>
  <text x="1118" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f8ea8">v0.2.0</text>
</svg>
